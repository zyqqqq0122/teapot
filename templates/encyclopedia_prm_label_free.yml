# EncyclopeDIA, label-free PRM. The recommended route for this data type.

input:  <path/to/samplesheet.csv>
fasta:  <path/to/proteins.fasta>
outdir: results

# --- Library ---
# A measured chromatogram library from the SAME instrument. Its other
# entries are the background, hence background_source: none.
elib:              <path/to/chromatogram_library.elib>
background_source: none

# --- Instrument ---
# LOAD-BEARING on an ion trap. Delete only if MS2 is high-resolution.
context_search_args: '-ftol 0.4 -ftolunits AMU -lftol 0.4 -lftolunits AMU -frag HCD'

fdr:               0.01
primary_abundance: encyclopedia
java_mem:          '32g'

# --- diathem (cross-run quantification) ---------------------------------------
run_diathem:             true
diathem_fragment_tol_th: 0.4     # absolute Th
diathem_precursor_tol:   0.02    # scheduled PRM centres the window on the target
diathem_rt_window:       150     # seconds; half the assay's own Window (min)

# --- Cluster ------------------------------------------------------------------
# Only needed with -profile hpc. Also settable in conf/hpc.config.
# cluster_options: '-A <your-slurm-account>'

# --- Container cache ---
# Images total several GB; point these at scratch, not $HOME.
# container_cache_dir: /path/to/shared/apptainer_cache
# container_tmp_dir:   /path/to/scratch/apptainer_tmp
